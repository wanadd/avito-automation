[project]
name = "avito-automation"
version = "0.1.0"
description = "Sprint 0.1 backend foundation for supplier catalog automation."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "argon2-cffi>=23.1.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "greenlet>=3.0.3",
    "pydantic-settings>=2.4.0",
    "pydantic>=2.8.2",
    "python-multipart>=0.0.20",
    "redis>=5.0.8",
    "rq>=1.16.2",
    "sqlalchemy>=2.0.32",
    "telethon>=1.37.0",
    "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.8",
    "pytest>=8.3.2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["apps/api"]
testpaths = ["tests"]
