x-api-env: &api-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://avito:change_me_local_only@postgres:5432/avito_automation}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  APP_ENV: ${APP_ENV:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
  TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
  TELEGRAM_SESSION_PATH: ${TELEGRAM_SESSION_PATH:-/data/telegram/session}
  TELEGRAM_COLLECTOR_ENABLED: ${TELEGRAM_COLLECTOR_ENABLED:-false}
  TELEGRAM_COLLECTOR_POLL_SECONDS: ${TELEGRAM_COLLECTOR_POLL_SECONDS:-300}
  TELEGRAM_BACKFILL_LIMIT: ${TELEGRAM_BACKFILL_LIMIT:-50}

x-api-build: &api-build
  context: .
  dockerfile: infra/docker/Dockerfile

x-api-depends: &api-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avito_automation}
      POSTGRES_USER: ${POSTGRES_USER:-avito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: *api-build
    environment: *api-env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./runtime/telegram:/data/telegram
    depends_on: *api-depends

  worker:
    build: *api-build
    command: ["python", "-m", "app.jobs.worker"]
    environment: *api-env
    volumes:
      - ./runtime/telegram:/data/telegram
    depends_on: *api-depends

  scheduler:
    build: *api-build
    command: ["python", "-m", "app.jobs.scheduler"]
    environment: *api-env
    volumes:
      - ./runtime/telegram:/data/telegram
    depends_on: *api-depends

volumes:
  postgres_data:
